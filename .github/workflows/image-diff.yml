name: Docker image report
on:
  pull_request_target:
    types: [opened, synchronize, reopened]
permissions:
  contents: read
  pull-requests: write
concurrency:
  group: docker-image-diff-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  describe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # This repository exercises its own action from the trusted base revision.
      # Never replace this ref with the PR head or merge ref.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
      - uses: ./
