name: CI
on:
  push:
    branches: [main]
    tags: ['v[0-9]*.[0-9]*.[0-9]*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          cache: npm
      - name: Validate release tag
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          test "$RELEASE_TAG" = "v$(node -p 'require("./package.json").version')"
          git fetch origin main:refs/remotes/origin/main
          git merge-base --is-ancestor "$GITHUB_SHA" refs/remotes/origin/main
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build
      - name: Check committed bundles
        run: git diff --exit-code -- dist/index.cjs dist/gitlab.cjs
      - name: Build helper container
        run: |
          docker build --platform linux/amd64 \
            --build-arg VERSION="$(node -p 'require("./package.json").version')" \
            --build-arg REVISION="$GITHUB_SHA" -t docker-image-diff:ci .
      - name: Smoke helper container
        run: node scripts/container-smoke.mjs docker-image-diff:ci
      - name: Save tested release image
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        run: docker save --output gitlab-helper-image.tar docker-image-diff:ci
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        with:
          name: gitlab-helper-image
          path: gitlab-helper-image.tar
          if-no-files-found: error
          retention-days: 1
  publish-container:
    needs: verify
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency: publish-container
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/technicpack/docker-image-diff
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: gitlab-helper-image
      - name: Load tested image
        run: |
          docker load --input gitlab-helper-image.tar
          test "$(docker image inspect docker-image-diff:ci --format '{{index .Config.Labels "org.opencontainers.image.revision"}}')" = "$GITHUB_SHA"
          test "v$(docker image inspect docker-image-diff:ci --format '{{index .Config.Labels "org.opencontainers.image.version"}}')" = "$RELEASE_TAG"
      - name: Authenticate and reject existing versions
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          node --input-type=module <<'NODE'
          const auth = Buffer.from(`${process.env.GITHUB_ACTOR}:${process.env.GHCR_TOKEN}`).toString('base64');
          const response = await fetch('https://ghcr.io/token?service=ghcr.io&scope=repository:technicpack/docker-image-diff:pull', {
            headers: { Authorization: `Basic ${auth}` },
          });
          if (!response.ok) throw new Error(`Registry authorization failed: ${response.status}`);
          const { token } = await response.json();
          if (!token) throw new Error('Registry token missing');
          const manifest = await fetch(`https://ghcr.io/v2/technicpack/docker-image-diff/manifests/${process.env.RELEASE_TAG}`, {
            method: 'HEAD',
            headers: {
              Authorization: `Bearer ${token}`,
              Accept: 'application/vnd.oci.image.index.v1+json, application/vnd.docker.distribution.manifest.v2+json, application/vnd.oci.image.manifest.v1+json',
            },
          });
          if (manifest.status !== 404) throw new Error(`Refusing publication: version exists or lookup failed (${manifest.status})`);
          NODE
      - name: Publish tested image
        run: |
          docker tag docker-image-diff:ci "$IMAGE:$RELEASE_TAG"
          docker push "$IMAGE:$RELEASE_TAG"
          digest="$(docker image inspect "$IMAGE:$RELEASE_TAG" --format '{{index .RepoDigests 0}}')"
          test -n "$digest"
          printf 'Image: %s\n\nRevision: %s\n' "$digest" "$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
